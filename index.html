<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tabele</title>
<style>
    table {
        border-collapse: collapse;
        margin: 20px;
        display: inline-block;
    }

    td {
        width: 60px;
        height: 45px;
        border: 1px solid black;
        text-align: center;
        font-size: 24px;
    }

    .green {
        background-color: rgb(210, 227, 193);
    }

    .num {
        background-color: #d9ebf7;
        height: 30px;
        width: 25px;
    }
</style>
</head>
<body>
    <table>
        <tr>
            <td class="num">1</td><td class="num">2</td><td class="num">3</td><td class="num">4</td><td class="num">5</td><td class="num">6</td>
        </tr>
        <tr><td class="num">2</td><td>a</td><td class="green">b</td><td class="green">c</td><td>d</td><td>e</td></tr>
        <tr><td class="num">3</td><td>f</td><td>g</td><td>h</td><td>i</td><td class="green">j</td></tr>
        <tr><td class="num">4</td><td>k</td><td>l</td><td>m</td><td>n</td><td class="green">o</td></tr>
        <tr><td class="num">5</td><td class="green">p</td><td class="green">q</td><td class="green">r</td><td>s</td><td>t</td></tr>
        <tr><td class="num">6</td><td class="green">u</td><td class="green">v</td><td class="green">w</td><td>y</td><td>z</td></tr>
    </table>
    <table>
        <tr>
            <td class="num">1</td><td class="num">2</td><td class="num">3</td><td class="num">4</td><td class="num">5</td><td class="num">6</td>
        </tr>
        <tr><td class="num">2</td><td>a</td><td class="green" colspan="2">b, c</td><td>d</td><td>e</td></tr>
        <tr><td class="num">3</td><td>f</td><td>g</td><td>h</td><td>i</td><td class="green" rowspan="2">j, o</td></tr>
        <tr><td class="num">4</td><td>k</td><td>l</td><td>m</td><td>n</td></tr>
        <tr><td class="num">5</td><td class="green" colspan="3" rowspan="2">p, q, r, u, v, w</td><td>s</td><td>t</td></tr>
        <tr><td class="num">6</td><td>y</td><td>z</td></tr>
    </table>
    <table>
        <tr>
            <td class="num">1</td><td class="num">2</td><td class="num">3</td><td class="num">4</td><td class="num">5</td><td class="num">6</td>
        </tr>
        <tr><td class="num">2</td><td>a</td><td>b</td><td>c</td><td class="green" colspan="2" rowspan="4">d, e, i, j, n, o, s, t</td></tr>
        <tr><td class="num">3</td><td>f</td><td>g</td><td>h</td></tr>
        <tr><td class="num">4</td><td>k</td><td>l</td><td>m</td></tr>
        <tr><td class="num">5</td><td>p</td><td>q</td><td>r</td></tr>
        <tr><td class="num">6</td><td>u</td><td>v</td><td>w</td><td>y</td><td>z</td></tr>
    </table>
</body>
</html>

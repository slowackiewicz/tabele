<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tabele</title>
<style>
    table {
        border-collapse: collapse;
        margin: 20px;
        display: inline-block;
    }

    td {
        width: 60px;
        height: 60px;
        border: 1px solid black;
        text-align: center;
        font-size: 24px;
    }

    .zielone {
        background-color: #dfe8c8;
    }

    .niebieskie {
        background-color: #d9ebf7;
    }
</style>
</head>
<body>

<!-- Tabela 1 -->
<table>
<tr>
    <td class="niebieskie">1</td><td class="niebieskie">2</td><td class="niebieskie">3</td>
    <td class="niebieskie">4</td><td class="niebieskie">5</td><td class="niebieskie">6</td>
</tr>
<tr><td class="niebieskie">2</td><td>a</td><td class="zielone">b</td><td class="zielone">c</td><td>d</td><td>e</td></tr>
<tr><td class="niebieskie">3</td><td>f</td><td>g</td><td>h</td><td>i</td><td class="zielone">j</td></tr>
<tr><td class="niebieskie">4</td><td>k</td><td>l</td><td>m</td><td>n</td><td class="zielone">o</td></tr>
<tr><td class="niebieskie">5</td><td class="zielone">p</td><td class="zielone">q</td><td class="zielone">r</td><td>s</td><td>t</td></tr>
<tr><td class="niebieskie">6</td><td class="zielone">u</td><td class="zielone">v</td><td class="zielone">w</td><td>y</td><td>z</td></tr>
</table>

<!-- Tabela 2 -->
<table>
<tr>
    <td class="niebieskie">1</td><td class="niebieskie">2</td><td class="niebieskie">3</td>
    <td class="niebieskie">4</td><td class="niebieskie">5</td><td class="niebieskie">6</td>
</tr>
<tr>
    <td class="niebieskie">2</td>
    <td>a</td>
    <td class="zielone" colspan="2">b, c</td>
    <td>d</td>
    <td>e</td>
</tr>
<tr>
    <td class="niebieskie">3</td>
    <td>f</td><td>g</td><td>h</td><td>i</td>
    <td class="zielone" rowspan="2">j, o</td>
</tr>
<tr>
    <td class="niebieskie">4</td>
    <td>k</td><td>l</td><td>m</td><td>n</td>
</tr>
<tr>
    <td class="niebieskie">5</td>
    <td class="zielone" colspan="4" rowspan="2">p, q, r, u, v, w</td>
    <td>s</td><td>t</td>
</tr>
<tr>
    <td class="niebieskie">6</td>
    <td>y</td><td>z</td>
</tr>
</table>

<!-- Tabela 3 -->
<table>
<tr>
    <td class="niebieskie">1</td><td class="niebieskie">2</td><td class="niebieskie">3</td>
    <td class="niebieskie">4</td><td class="niebieskie">5</td><td class="niebieskie">6</td>
</tr>
<tr>
    <td class="niebieskie">2</td>
    <td>a</td>
    <td class="zielone" colspan="2">b, c</td>
    <td>d</td>
    <td rowspan="3" class="zielone">e, j, o</td>
</tr>
<tr>
    <td class="niebieskie">3</td>
    <td>f</td><td>g</td><td>h</td><td>i</td>
</tr>
<tr>
    <td class="niebieskie">4</td>
    <td>k</td><td>l</td><td>m</td><td>n</td>
</tr>
<tr>
    <td class="niebieskie">5</td>
    <td class="zielone" colspan="3" rowspan="2">p, q, r, u, v, w</td>
    <td rowspan="2" class="zielone">s, y</td>
    <td>t</td>
</tr>
<tr>
    <td class="niebieskie">6</td>
    <td>z</td>
</tr>
</table>

</body>
</html>
